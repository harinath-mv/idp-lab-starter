name: repo-health

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days to look back"
        required: true
        type: string
      entity:
        description: "Repo entity the action ran on"
        required: true
        type: string
      run_id:
        description: "Port run ID"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/port-api
    env:
      PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
      PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Health check, reported live to Port
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python repo_health.py