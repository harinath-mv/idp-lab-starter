name: port-terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ["port/**", ".github/workflows/port-terraform.yml"]

permissions:
  id-token: write      # OIDC login to AWS for the state file (Day 5)
  contents: read
  pull-requests: write # post the plan on the PR

env:
  AWS_REGION: ap-south-1
  TF_VERSION: 1.13.3
  PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
  PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}

concurrency:
  group: port-terraform
  cancel-in-progress: false

jobs:
  port-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: port
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Log in to AWS with OIDC (read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform fmt -check
      - run: terraform init -input=false
      - run: terraform validate
      - name: Plan
        run: terraform plan -input=false -no-color | tee plan.txt
      - name: Post plan on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('port/plan.txt', 'utf8');
            const summary = (plan.match(/Plan: .*|No changes\..*/) || ['(see logs)'])[0];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Port Terraform plan\n**${summary}**\n<details><summary>Show full plan</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`
            });

  port-apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: port
    defaults:
      run:
        working-directory: port
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Log in to AWS with OIDC (apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false
      - run: terraform plan -input=false -out=tfplan
      - run: terraform apply -input=false tfplan