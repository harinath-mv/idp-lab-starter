name: terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write       # lets the job ask GitHub for an OIDC token (Day 5)
  contents: read        # lets checkout read the code
  pull-requests: write  # lets the job post the plan as a PR comment

env:
  AWS_REGION: ap-south-1
  TF_VERSION: 1.13.3

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Install tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.59.1

      - name: tflint init (downloads the AWS rules)
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: tflint (code quality)
        run: tflint --recursive --config "$PWD/.tflint.hcl" --format compact

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov

      - name: Checkov (security and compliance)
        run: checkov -d . --framework terraform --compact --quiet

  plan:
    needs: gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-setup
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          working-directory: infra/envs/${{ matrix.env }}
          terraform-version: ${{ env.TF_VERSION }}
      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: infra
      - name: Validate
        run: terraform validate
      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt
      - name: Post plan on the PR
        uses: actions/github-script@v7
        env:
          PLAN_FILE: infra/envs/${{ matrix.env }}/plan.txt
          ENV_NAME: ${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const summary = (plan.match(/Plan: .*|No changes\..*/) || ['(see logs)'])[0];
            const body = `### Terraform plan: \`${process.env.ENV_NAME}\`\n**${summary}**\n<details><summary>Show full plan</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  apply-dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-setup
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          working-directory: infra/envs/dev
          terraform-version: ${{ env.TF_VERSION }}
      - run: terraform plan -input=false -out=tfplan
      - run: terraform apply -input=false tfplan
      - run: terraform output

  apply-prod:
    needs: apply-dev
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-setup
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          working-directory: infra/envs/prod
          terraform-version: ${{ env.TF_VERSION }}
      - run: terraform plan -input=false -out=tfplan
      - run: terraform apply -input=false tfplan
      - run: terraform output